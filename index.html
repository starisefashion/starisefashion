<!DOCTYPE html>
<html>
<head>
  <title>StarRise Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff;
      color: #333;
    }
    header {
      background: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .hero {
      text-align: center;
      padding: 40px 20px;
      background: linear-gradient(to right, #ff758c, #ff7eb3);
      color: #fff;
    }
    .hero h1 {
      margin: 0;
      font-size: 28px;
    }
    .hero p {
      margin: 10px 0 20px;
    }
    .btn {
      background: #000;
      color: #fff;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 25px;
      font-size: 16px;
    }
    .section {
      padding: 20px;
      text-align: center;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .card {
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 10px;
    }
    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  StarRise Fashion
</header>

<div class="hero">
  <h1>Style That Defines You</h1>
  <p>Trendy Ladies Wear, Earrings & Accessories</p>
  <a class="btn" href="https://fulfillvision.payhip.com">Shop Now</a>
</div>

<div class="section">
  <h2>Our Collection</h2>
  <div class="products">
    <div class="card">👗 Dresses</div>
    <div class="card">💍 Earrings</div>
    <div class="card">👜 Accessories</div>
    <div class="card">🔥 Trending</div>
  </div>
</div>

<div class="section">
  <h2>Why Choose Us?</h2>
  <p>✔ Latest Fashion Trends</p>
  <p>✔ Affordable Prices</p>
  <p>✔ Easy Shopping Experience</p>
</div>

<footer>
  © 2026 StarRise Fashion | All Rights Reserved
</footer>

</body>
</html>
